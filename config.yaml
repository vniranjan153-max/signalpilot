# Edit this file to change what the dashboard tracks.
# Symbols use Yahoo Finance tickers (.NS = NSE India, .BO = BSE, -USD = crypto).
history_years: 6          # years of daily data to train on
horizon_days: 5           # model predicts: will price be higher in N trading days?
buy_threshold: 0.58       # BUY  when P(up) >= this
sell_threshold: 0.42      # SELL when P(up) <= this (exit / avoid)
cost_bps: 10              # round-trip cost assumed in the backtest (basis points per position change)
min_train_rows: 500       # first walk-forward fold starts after this many rows
retrain_every: 21         # walk-forward: retrain every N trading days
assets:
  - {symbol: "^NSEI",       name: "NIFTY 50"}
  - {symbol: "^NSEBANK",    name: "BANK NIFTY"}
  - {symbol: "RELIANCE.NS", name: "Reliance Industries"}
  - {symbol: "TCS.NS",      name: "Tata Consultancy"}
  - {symbol: "HDFCBANK.NS", name: "HDFC Bank"}
  - {symbol: "INFY.NS",     name: "Infosys"}
  - {symbol: "BTC-USD",     name: "Bitcoin"}
  - {symbol: "GC=F",        name: "Gold futures"}
